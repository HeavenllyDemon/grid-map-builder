name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build release assets
        run: npm run package:release

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              release/grid-map-builder-portable-"$TAG".zip \
              release/grid-map-builder-update-"$TAG".tgz \
              release/checksums.txt \
              --clobber
          else
            gh release create "$TAG" \
              release/grid-map-builder-portable-"$TAG".zip \
              release/grid-map-builder-update-"$TAG".tgz \
              release/checksums.txt \
              --title "$TAG" \
              --notes "Portable Grid Map Builder release. Download the zip, unzip it, and run the start script for your platform."
          fi
